<!DOCTYPE html>

<head>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#102a43; --teal:#087e8b; --mint:#8ff3e8;
  --bg:#eef2f6; --paper:#fff; --text:#334155; --muted:#64748b;
  --chip:#eaf5f6; --chip-b:#d3e8ea; --line:#e2e8f0; --h:#102a43;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0b1620; --paper:#12202d; --text:#cbd5e1; --muted:#94a3b8;
    --chip:#183142; --chip-b:#24485c; --line:#223446; --h:#e6f1f5;}
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;padding:40px 16px}
.cv{max-width:1050px;margin:auto;background:var(--paper);border-radius:14px;overflow:hidden;display:grid;grid-template-columns:300px 1fr;box-shadow:0 18px 50px rgba(16,42,67,.15)}

/* Barra lateral */
aside{background:linear-gradient(170deg,var(--navy),#0a5f6b);color:#fff;padding:36px 26px}
.photo{width:170px;height:200px;object-fit:cover;object-position:center 25%;border-radius:14px;border:4px solid rgba(255,255,255,.75);display:block;margin:0 auto 24px;background:#0a4f5a}
aside h2{font-size:15px;font-weight:700;color:var(--mint);margin:26px 0 10px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.2)}
aside ul{list-style:none;font-size:13.5px}
aside li{padding:3px 0;word-break:break-word}
aside a{color:#fff;text-decoration:none}
aside a:hover,aside a:focus-visible{text-decoration:underline}

/* Contenido */
main{padding:42px 44px}
header{margin-bottom:30px}
h1{font-size:32px;font-weight:800;line-height:1.2;color:var(--h)}
.role{color:var(--teal);font-weight:600;font-size:16px;margin-top:6px}
section{margin-bottom:30px}
h3.t{font-size:18px;font-weight:700;color:var(--h);border-left:5px solid var(--teal);padding-left:12px;margin-bottom:14px}
p{font-size:14.5px;max-width:68ch}
.card{background:var(--chip);border:1px solid var(--chip-b);border-radius:10px;padding:16px 18px}
.card b{color:var(--h)}
.card p+p{margin-top:2px}

.group{margin-bottom:16px}
.group h4{font-size:14px;color:var(--h);margin-bottom:8px;font-weight:700}
.group h4 small{font-weight:500;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--chip);border:1px solid var(--chip-b);border-radius:999px;padding:5px 14px;font-size:13.5px;font-weight:600;color:var(--h)}

.btn{margin-top:22px;width:100%;background:var(--mint);color:var(--navy);border:0;border-radius:8px;padding:10px;font:700 13.5px 'Inter',sans-serif;cursor:pointer}
.btn:hover{filter:brightness(.93)}
:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
footer{grid-column:1/-1;background:var(--navy);color:#cfe3ea;text-align:center;font-size:12px;padding:16px}

@media(max-width:800px){
  .cv{grid-template-columns:1fr}
  main{padding:28px 22px}
  h1{font-size:26px}
}
@media print{
  body{background:#fff;padding:0}
  .cv{box-shadow:none;border-radius:0}
  aside,footer{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .btn{display:none}
}
</style>
</head>
